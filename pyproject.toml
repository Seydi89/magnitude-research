[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magnitude-research"
version = "0.1.0"
description = "Clean, reproducible pilots for metric-space magnitude in memory selection and continual learning"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "H. Şeyda Gündüz Jordan"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
magresearch = "magnitude_research.cli:main"

[project.urls]
Repository = "https://github.com/Seydi89/magnitude-research"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
